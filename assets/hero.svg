<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Riccardo Zozzolotto — Junior AI Solutions Engineer">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="40%" stop-color="#22D3EE" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbA">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity=".40"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC">
      <stop offset="0%" stop-color="#F472B6" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.1" fill="#273043"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="65%" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1280" height="420" fill="url(#gridFade)"/></mask>
    <clipPath id="frame"><rect width="1280" height="420" rx="20"/></clipPath>
    <clipPath id="typeClip"><rect id="typeBar" x="70" y="282" width="0" height="32"/></clipPath>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

      .orbA { animation: driftA 16s ease-in-out infinite alternate; }
      .orbB { animation: driftB 20s ease-in-out infinite alternate; }
      .orbC { animation: driftA 24s ease-in-out infinite alternate-reverse; }
      @keyframes driftA { from { transform: translate(0,0) scale(1); } to { transform: translate(-70px,38px) scale(1.14); } }
      @keyframes driftB { from { transform: translate(0,0) scale(1.06); } to { transform: translate(60px,-34px) scale(.92); } }

      .word { animation: rise .9s cubic-bezier(.2,.75,.2,1) both; }
      .w2 { animation-delay: .12s; }
      @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }

      .shine { animation: shine 6s ease-in-out infinite; }
      @keyframes shine { 0%,100% { opacity: .0; } 50% { opacity: .22; } }

      .eyebrow { animation: fade 1s ease-out .35s both; }
      .chips { animation: fade 1s ease-out .8s both; }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

      .pulse { animation: pulse 2.1s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: 1; r: 4; } 50% { opacity: .35; r: 6; } }

      #typeBar { animation: type 2.6s steps(34) 1s both; }
      @keyframes type { from { width: 0; } to { width: 468px; } }
      .caret { animation: caret 2.6s steps(34) 1s both, blink 1s steps(1) 3.6s infinite; }
      @keyframes caret { from { transform: translateX(0); } to { transform: translateX(464px); } }
      @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }

      .sweep { animation: sweep 7s cubic-bezier(.5,0,.5,1) infinite; }
      @keyframes sweep { 0% { transform: translateX(-620px); opacity: 0; } 12% { opacity: 1; } 70%,100% { transform: translateX(1280px); opacity: 0; } }

      .ring1 { animation: spin 26s linear infinite; transform-origin: 1092px 204px; }
      .ring2 { animation: spin 18s linear infinite reverse; transform-origin: 1092px 204px; }
      .ring3 { animation: spin 34s linear infinite; transform-origin: 1092px 204px; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .bar { animation: bars 2.8s ease-in-out infinite; transform-origin: bottom; }
      .b2 { animation-delay: .25s; } .b3 { animation-delay: .5s; }
      .b4 { animation-delay: .75s; } .b5 { animation-delay: 1s; }
      @keyframes bars { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }

      @media (prefers-reduced-motion: reduce) {
        .orbA,.orbB,.orbC,.word,.shine,.eyebrow,.chips,.pulse,#typeBar,.caret,.sweep,.ring1,.ring2,.ring3,.bar {
          animation: none;
        }
        #typeBar { width: 468px; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="#07080D"/>
    <g style="mix-blend-mode:screen">
      <circle class="orbA" cx="980" cy="90"  r="300" fill="url(#orbA)"/>
      <circle class="orbB" cx="170" cy="380" r="330" fill="url(#orbB)"/>
      <circle class="orbC" cx="640" cy="40"  r="260" fill="url(#orbC)"/>
    </g>
    <rect width="1280" height="420" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect class="sweep" x="0" y="0" width="420" height="420" fill="url(#hair)" opacity=".16"/>

    <!-- occhiello -->
    <g class="eyebrow">
      <circle class="pulse" cx="76" cy="83" r="4" fill="#22D3EE"/>
      <text class="mono" x="94" y="88" font-size="14" letter-spacing="4.5" fill="#7DD3FC" textLength="352" lengthAdjust="spacing">JUNIOR AI SOLUTIONS ENGINEER</text>
      <text class="mono" x="1208" y="88" font-size="14" letter-spacing="3" fill="#7A8699" text-anchor="end" textLength="118" lengthAdjust="spacing">TREVISO · IT</text>
    </g>

    <!-- nome -->
    <g>
      <text class="sans word"    x="68" y="182" font-size="86" font-weight="800" letter-spacing="-2" fill="#F8FAFC" textLength="498" lengthAdjust="spacingAndGlyphs">RICCARDO</text>
      <text class="sans word w2" x="68" y="254" font-size="86" font-weight="800" letter-spacing="-2" fill="url(#neon)" textLength="625" lengthAdjust="spacingAndGlyphs">ZOZZOLOTTO</text>
      <text class="sans word w2 shine" x="68" y="254" font-size="86" font-weight="800" letter-spacing="-2" fill="#FFFFFF" textLength="625" lengthAdjust="spacingAndGlyphs">ZOZZOLOTTO</text>
    </g>

    <!-- riga che si scrive -->
    <g clip-path="url(#typeClip)">
      <text class="mono" x="72" y="305" font-size="18" fill="#94A3B8" textLength="462" lengthAdjust="spacingAndGlyphs">$ sistemi AI che superano la demo</text>
    </g>
    <rect class="caret" x="72" y="288" width="9" height="22" fill="#22D3EE"/>

    <!-- chip -->
    <g class="chips" font-size="12.5" letter-spacing="2.4">
      <g transform="translate(68,348)">
        <rect width="156" height="30" rx="15" fill="#0F172A" stroke="#1E293B"/>
        <text class="mono" x="78" y="20" fill="#67E8F9" text-anchor="middle" textLength="116" lengthAdjust="spacing">LLM · RAG · OCR</text>
      </g>
      <g transform="translate(236,348)">
        <rect width="188" height="30" rx="15" fill="#0F172A" stroke="#1E293B"/>
        <text class="mono" x="94" y="20" fill="#A5B4FC" text-anchor="middle" textLength="148" lengthAdjust="spacing">PYTHON · TYPESCRIPT</text>
      </g>
      <g transform="translate(436,348)">
        <rect width="172" height="30" rx="15" fill="#0F172A" stroke="#1E293B"/>
        <text class="mono" x="86" y="20" fill="#F9A8D4" text-anchor="middle" textLength="132" lengthAdjust="spacing">PIPELINE DATI</text>
      </g>
    </g>

    <!-- orbite -->
    <g fill="none" stroke-linecap="round">
      <g class="ring1" stroke="#22D3EE" stroke-opacity=".55" stroke-width="1.6">
        <circle cx="1092" cy="204" r="132" stroke-dasharray="160 70"/>
      </g>
      <g class="ring2" stroke="#818CF8" stroke-opacity=".5" stroke-width="1.6">
        <circle cx="1092" cy="204" r="98" stroke-dasharray="90 120"/>
      </g>
      <g class="ring3" stroke="#F472B6" stroke-opacity=".45" stroke-width="1.6">
        <circle cx="1092" cy="204" r="164" stroke-dasharray="40 200"/>
      </g>
      <circle cx="1092" cy="204" r="60" stroke="#1E293B" stroke-width="1.4"/>
    </g>
    <g class="ring1"><circle cx="1224" cy="204" r="5" fill="#22D3EE"/></g>
    <g class="ring2"><circle cx="994"  cy="204" r="4.5" fill="#818CF8"/></g>
    <g class="ring3"><circle cx="1092" cy="40"  r="4" fill="#F472B6"/></g>
    <circle class="pulse" cx="1092" cy="204" r="4" fill="#E2E8F0"/>

    <!-- barre -->
    <g transform="translate(1136,372)">
      <rect class="bar"    x="0"  y="-44" width="7" height="44" rx="3.5" fill="#22D3EE" opacity=".85"/>
      <rect class="bar b2" x="14" y="-44" width="7" height="44" rx="3.5" fill="#38BDF8" opacity=".85"/>
      <rect class="bar b3" x="28" y="-44" width="7" height="44" rx="3.5" fill="#818CF8" opacity=".85"/>
      <rect class="bar b4" x="42" y="-44" width="7" height="44" rx="3.5" fill="#A78BFA" opacity=".85"/>
      <rect class="bar b5" x="56" y="-44" width="7" height="44" rx="3.5" fill="#F472B6" opacity=".85"/>
    </g>

    <rect x="0" y="416" width="1280" height="4" fill="url(#hair)"/>
    <rect width="1280" height="420" rx="20" fill="none" stroke="#1B2435" stroke-width="2"/>
  </g>
</svg>

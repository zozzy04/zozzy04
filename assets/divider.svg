<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 10" width="1280" height="10" role="presentation">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#22D3EE" stop-opacity=".55"/>
      <stop offset="55%"  stop-color="#818CF8" stop-opacity=".55"/>
      <stop offset="80%"  stop-color="#F472B6" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spark">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="35%"  stop-color="#67E8F9" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
    <style>
      .run { animation: run 5.5s cubic-bezier(.45,0,.55,1) infinite; }
      @keyframes run { 0% { transform: translateX(-120px); } 100% { transform: translateX(1400px); } }
      @media (prefers-reduced-motion: reduce) { .run { animation: none; opacity: .5; } }
    </style>
  </defs>
  <rect x="0" y="4" width="1280" height="2" rx="1" fill="url(#base)"/>
  <ellipse class="run" cx="0" cy="5" rx="110" ry="5" fill="url(#spark)"/>
</svg>
